<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bản đồ sân thể thao Alobooking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Be Vietnam Pro', -apple-system, sans-serif; background: #e2e8f0; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    
    /* Top floating bar */
    .map-controls-top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .map-controls-top > * { pointer-events: auto; }
    
    .chip-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 5px 8px;
      border-radius: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      backdrop-filter: blur(8px);
      -webkit-overflow-scrolling: touch;
    }
    .chip-bar::-webkit-scrollbar { display: none; }
    
    .filter-chip {
      border: none;
      outline: none;
      background: #f1f5f9;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: inherit;
    }
    .filter-chip:hover { background: #e2e8f0; }
    .filter-chip.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.35);
    }
    
    .city-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 3px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      backdrop-filter: blur(8px);
      margin-left: auto;
    }
    .city-btn {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s;
      font-family: inherit;
    }
    .city-btn.active {
      background: #0f172a;
      color: #ffffff;
    }
    
    /* Prominent GPS button with text */
    .locate-pill-btn {
      position: absolute;
      bottom: 20px;
      right: 12px;
      z-index: 999;
      background: linear-gradient(135deg, #0369a1, #0284c7);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 24px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(21, 128, 61, 0.45);
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .locate-pill-btn:hover {
      background: linear-gradient(135deg, #075985, #0369a1);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(21, 128, 61, 0.55);
    }
    .locate-pill-btn:active {
      transform: translateY(0);
    }
    .locate-pill-btn svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }
    .locate-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      animation: pulse-ring 1.3s infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 8px #38bdf8; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }
    
    .venue-count-badge {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 999;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: calc(100% - 190px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .venue-count-dot {
      width: 8px;
      height: 8px;
      min-width: 8px;
      border-radius: 50%;
      background: #0ea5e9;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    
    /* Card popup styles */
    .gm-style-iw { padding: 0 !important; border-radius: 14px !important; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.16) !important; }
    .gm-style-iw-d { padding: 0 !important; overflow: hidden !important; max-height: none !important; }
    .gm-ui-hover-effect { top: 4px !important; right: 4px !important; background: rgba(255,255,255,0.9) !important; border-radius: 50% !important; }
    
    .leaflet-popup-content-wrapper { padding: 0 !important; border-radius: 14px !important; overflow: hidden; }
    .leaflet-popup-content { margin: 0 !important; line-height: normal !important; }
    
    .iw-card { width: 260px; font-family: 'Be Vietnam Pro', sans-serif; background: #ffffff; }
    .iw-img-wrapper { position: relative; width: 100%; height: 110px; background: #cbd5e1; overflow: hidden; }
    .iw-img { width: 100%; height: 100%; object-fit: cover; }
    .iw-badge { position: absolute; top: 6px; left: 6px; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; }
    .iw-rating { position: absolute; top: 6px; right: 6px; background: rgba(15, 23, 42, 0.85); color: #fbbf24; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
    .iw-content { padding: 10px 12px 12px 12px; }
    .iw-title { font-size: 13px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 4px; }
    .iw-addr { font-size: 11px; color: #64748b; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .iw-dist { font-size: 11px; color: #0284c7; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 3px; }
    .iw-hours { font-size: 11px; color: #0284c7; font-weight: 600; margin-bottom: 8px; }
    .iw-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 8px; gap: 8px; }
    .iw-price { font-size: 12px; font-weight: 800; color: #0284c7; }
    .iw-book-btn { background: #0284c7; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .iw-book-btn:hover { background: #0369a1; }
  </style>
</head>

  <script>
    // Danh sách sân do ứng dụng gửi sang (tin nhắn SET_VENUES) hoặc đọc từ localStorage khi mở bản đồ ở tab riêng.
    // Không còn danh sách cố định: trước đây bản đồ chỉ hiện đúng 70 sân mẫu cũ dù ứng dụng có hàng trăm sân.
    var venuesData = loadVenuesFromStorage();

    function loadVenuesFromStorage() {
      try {
        var raw = window.localStorage.getItem('alobooking_venues');
        var arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    // Tên sân, địa chỉ... đến từ dữ liệu bên ngoài nên phải làm sạch trước khi chèn vào HTML
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeUrl(u) {
      u = String(u || '');
      return /^https?:\/\//i.test(u) ? u : '';
    }
    function hasCoords(v) {
      return isFinite(Number(v.lat)) && isFinite(Number(v.lng)) && Number(v.lat) !== 0 && Number(v.lng) !== 0;
    }

    var googleMap = null;
    var leafletMap = null;
    var googleMarkers = [];
    var leafletMarkers = [];

    var currentCity = 'hn';
    var currentInfoWindow = null;
    var currentUserPos = null;

    };

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      var R = 6371;
      var dLat = (lat2 - lat1) * (Math.PI / 180);
      var dLon = (lon2 - lon1) * (Math.PI / 180);
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function initGoogleMap() {
      if (isGoogleMapLoaded) return;
      try {
        if (!window.google || !window.google.maps) {
          throw new Error('Google Maps SDK not ready');
        }

        var mapDiv = document.getElementById('map');
        mapDiv.innerHTML = '';

        var initial = CITIES.hn;
        googleMap = new google.maps.Map(mapDiv, {
          center: { lat: initial.lat, lng: initial.lng },
          zoom: initial.zoom,
          mapTypeControl: false,
          zoomControl: true,
          zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
          streetViewControl: false,
          fullscreenControl: false,
          styles: [
            { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
            { featureType: 'transit', elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
            { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#c7e3f4' }] },
            { featureType: 'landscape.natural', elementType: 'geometry', stylers: [{ color: '#f8fafc' }] }
          ]
        });

        isGoogleMapLoaded = true;
        googleMap.addListener('zoom_changed', applyPinSize);
        renderGoogleMarkers();
        console.log('Google Maps initialized successfully with', venuesData.length, 'venues');
      } catch (err) {
        console.warn('Google Maps initialization failed, switching to backup map:', err);
        initLeafletMap();
      }
    }

    function initLeafletMap() {
      if (isGoogleMapLoaded) return;
      if (leafletMap) return;

      var mapDiv = document.getElementById('map');
      mapDiv.innerHTML = '';

      var initial = CITIES.hn;
      leafletMap = L.map('map', { zoomControl: false }).setView([initial.lat, initial.lng], initial.zoom);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap);

      L.control.zoom({ position: 'topright' }).addTo(leafletMap);
      renderLeafletMarkers();
      console.log('Backup map initialized successfully with', venuesData.length, 'venues');
    }

    setTimeout(function() {
      if (!isGoogleMapLoaded) {
        initLeafletMap();
      }
    }, 3000);

    // Creates high-definition SVG pin with the sport logo inside
    function createMarkerIconSvg(type) {
      var color = SPORT_COLORS[type] || '#0369a1';
      var logoSvg = SPORT_SVG_LOGOS[type] || SPORT_SVG_LOGOS['badminton'];

      return '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="58" viewBox="0 0 48 58">' +
        '<defs>' +
          '<filter id="sh_' + type + '" x="-25%" y="-20%" width="150%" height="150%">' +
            '<feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-opacity="0.45"/>' +
          '</filter>' +
        '</defs>' +
        '<path d="M24 2C13 2 4 11 4 22c0 14 20 32 20 32s20-18 20-32C44 11 35 2 24 2z" fill="' + color + '" filter="url(#sh_' + type + ')"/>' +
        '<circle cx="24" cy="21" r="16.5" fill="#ffffff"/>' +
        logoSvg +
      '</svg>';
    }

    var SPORT_FALLBACK_IMG = {
      badminton: 'https://images.pexels.com/photos/8007089/pexels-photo-8007089.jpeg?auto=compress&cs=tinysrgb&w=600&h=340&fit=crop',
      pickleball: 'https://images.pexels.com/photos/29439337/pexels-photo-29439337.jpeg?auto=compress&cs=tinysrgb&w=600&h=340&fit=crop',
      tennis: 'https://images.pexels.com/photos/1784798/pexels-photo-1784798.jpeg?auto=compress&cs=tinysrgb&w=600&h=340&fit=crop',
      basketball: 'https://images.pexels.com/photos/1702624/pexels-photo-1702624.jpeg?auto=compress&cs=tinysrgb&w=600&h=340&fit=crop',
      football: 'https://images.pexels.com/photos/13907433/pexels-photo-13907433.jpeg?auto=compress&cs=tinysrgb&w=600&h=340&fit=crop'
    };

    function buildCardHtml(v) {
      var color = SPORT_COLORS[v.type] || '#0369a1';
      var typeName = SPORT_NAMES[v.type] || esc(v.type);
      var img = safeUrl(v.image) || SPORT_FALLBACK_IMG[v.type] || SPORT_FALLBACK_IMG.badminton;
      var rating = Number(v.rating) > 0 ? Number(v.rating).toFixed(1) : 'Mới';

      var distHtml = '';
      if (currentUserPos) {
        var d = getDistanceFromLatLonInKm(currentUserPos.lat, currentUserPos.lng, v.lat, v.lng);
        var dStr = d < 1.0 ? Math.round(d * 1000) + ' m' : d.toFixed(1) + ' km';
        distHtml = '<div class="iw-dist">📍 Cách bạn: ' + dStr + '</div>';
      }

      return '<div class="iw-card">' +
        '<div class="iw-img-wrapper">' +
          '<img class="iw-img" src="' + esc(img) + '" alt="' + esc(v.name) + '"/>' +
          '<div class="iw-badge" style="background: ' + color + ';">' + typeName + '</div>' +
          '<div class="iw-rating">★ ' + rating + '</div>' +
        '</div>' +
        '<div class="iw-content">' +
          '<div class="iw-title">' + esc(v.name) + '</div>' +
          distHtml +
          '<div class="iw-addr">📌 ' + esc(v.address || v.district || 'Hà Nội') + '</div>' +
          '<div class="iw-hours">⏰ ' + esc(v.hours || '06:00 - 23:00') + '</div>' +
          '<div class="iw-footer">' +
            '<div class="iw-price">' + esc(v.price || 'Liên hệ') + '</div>' +
            '<button class="iw-book-btn" onclick="bookVenue(' + Number(v.id) + ')">Đặt sân</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    var iconUrlCache = {};
    function markerIconUrl(type) {
      if (!iconUrlCache[type]) {
        iconUrlCache[type] = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(createMarkerIconSvg(type));
      }
      return iconUrlCache[type];
    }

    // Biểu tượng cụm ghim: vòng tròn xanh có số sân trong cụm
    function clusterIcon(count) {
      var size = count < 10 ? 40 : (count < 100 ? 48 : 56);
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
        '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + (size / 2 - 2) + '" fill="#0369a1" fill-opacity="0.92" stroke="#ffffff" stroke-width="3"/>' +
        '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="' + (size > 48 ? 16 : 14) +
        '" font-weight="700" fill="#ffffff">' + count + '</text></svg>';
      return { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg), size: size };
    }

    // Kích thước ghim đổi theo mức zoom: zoom xa thì nhỏ cho đỡ chồng lên nhau, zoom gần thì to dần về cỡ gốc 48x58
    var PIN_RATIO = 58 / 48;
    var pinIconCache = {};
    var currentPinWidth = 0;

    function pinWidth(zoom) {
      if (zoom >= 17) return 48;
      if (zoom === 16) return 44;
      if (zoom === 15) return 38;
      if (zoom === 14) return 30;
      if (zoom === 13) return 24;
      return 20;
    }

    function pinIcon(type, w) {
      var key = type + '|' + w;
      if (!pinIconCache[key]) {
        var h = Math.round(w * PIN_RATIO);
        pinIconCache[key] = {
          url: markerIconUrl(type),
          scaledSize: new google.maps.Size(w, h),
          anchor: new google.maps.Point(w / 2, h)
        };
      }
      return pinIconCache[key];
    }

    // Thẻ thông tin phải nằm ngay trên đỉnh ghim, nên độ lệch cũng đổi theo kích thước ghim
    function infoOffsetY(zoom) {
      return Math.round(pinWidth(zoom) * PIN_RATIO * 0.72);
    }

    function applyPinSize() {
      if (!googleMap) return;
      var w = pinWidth(googleMap.getZoom() || 13);
      if (w === currentPinWidth) return;
      currentPinWidth = w;
      for (var i = 0; i < googleMarkers.length; i++) {
        googleMarkers[i].setIcon(pinIcon(googleMarkers[i].venueData.type, w));
      }
    }

    var googleClusterer = null;
    // Chỉ gom ghim thành cụm khi thu nhỏ bản đồ ra xa (zoom <= 12); từ mức mặc định (13) trở vào hiện từng ghim riêng
    var CLUSTER_MAX_ZOOM = 12;

    function renderGoogleMarkers() {
      if (googleClusterer) {
        googleClusterer.clearMarkers();
        googleClusterer.setMap(null);
        googleClusterer = null;
      }
      for (var i = 0; i < googleMarkers.length; i++) {
        googleMarkers[i].setMap(null);
      }
      googleMarkers = [];
      currentPinWidth = pinWidth(googleMap.getZoom() || 13);

      for (var j = 0; j < venuesData.length; j++) {
        var v = venuesData[j];
        if (currentFilter !== 'all' && v.type !== currentFilter) continue;
        if (!hasCoords(v)) continue;

        var marker = new google.maps.Marker({
          position: { lat: Number(v.lat), lng: Number(v.lng) },
          title: v.name,
          icon: pinIcon(v.type, currentPinWidth)
        });

        marker.venueId = v.id;
        marker.venueData = v;

        (function(m, venue) {
          m.addListener('click', function() {
            if (currentInfoWindow) currentInfoWindow.close();
            currentInfoWindow = new google.maps.InfoWindow({
              content: buildCardHtml(venue),
              pixelOffset: new google.maps.Size(0, -infoOffsetY(googleMap.getZoom() || 13))
            });
            currentInfoWindow.open(googleMap, m);
            notifyParent('VENUE_SELECTED', { venueId: venue.id });
          });
        })(marker, v);

        googleMarkers.push(marker);
      }

      if (window.markerClusterer && markerClusterer.MarkerClusterer) {
        googleClusterer = new markerClusterer.MarkerClusterer({
          map: googleMap,
          markers: googleMarkers,
          algorithm: markerClusterer.SuperClusterAlgorithm
            ? new markerClusterer.SuperClusterAlgorithm({ radius: 60, maxZoom: CLUSTER_MAX_ZOOM })
            : undefined,
          renderer: {
            render: function(cluster) {
              var ic = clusterIcon(cluster.count);
              return new google.maps.Marker({
                position: cluster.position,
                icon: {
                  url: ic.url,
                  scaledSize: new google.maps.Size(ic.size, ic.size),
                  anchor: new google.maps.Point(ic.size / 2, ic.size / 2)
                },
                zIndex: Number(google.maps.Marker.MAX_ZINDEX) + cluster.count
              });
            }
          }
        });
      } else {
        for (var k = 0; k < googleMarkers.length; k++) {
          googleMarkers[k].setMap(googleMap);
        }
      }

      document.getElementById('venueCountText').textContent = googleMarkers.length + ' sân thể thao khả dụng';
    }

    var leafletCluster = null;
    var leafletSvgCache = {};

    function renderLeafletMarkers() {
      if (leafletCluster) {
        leafletMap.removeLayer(leafletCluster);
        leafletCluster = null;
      }
      for (var i = 0; i < leafletMarkers.length; i++) {
        leafletMap.removeLayer(leafletMarkers[i]);
      }
      leafletMarkers = [];

      var group = (typeof L.markerClusterGroup === 'function')
        ? L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 50, disableClusteringAtZoom: CLUSTER_MAX_ZOOM + 1 })
        : null;

      for (var j = 0; j < venuesData.length; j++) {
        var v = venuesData[j];
        if (currentFilter !== 'all' && v.type !== currentFilter) continue;
        if (!hasCoords(v)) continue;

        if (!leafletSvgCache[v.type]) leafletSvgCache[v.type] = createMarkerIconSvg(v.type);
        var icon = L.divIcon({
          html: leafletSvgCache[v.type],
          className: '',
          iconSize: [48, 58],
          iconAnchor: [24, 58],
          popupAnchor: [0, -48]
        });

        var marker = L.marker([Number(v.lat), Number(v.lng)], { icon: icon });
        marker.venueId = v.id;
        marker.venueData = v;

        (function(venue, m) {
          m.bindPopup(function() { return buildCardHtml(venue); });
          m.on('click', function() {
            notifyParent('VENUE_SELECTED', { venueId: venue.id });
          });
        })(v, marker);

        if (group) group.addLayer(marker); else marker.addTo(leafletMap);
        leafletMarkers.push(marker);
      }

      if (group) {
        leafletMap.addLayer(group);
        leafletCluster = group;
      }

      document.getElementById('venueCountText').textContent = leafletMarkers.length + ' sân thể thao khả dụng';
    }

    function bookVenue(venueId) {
      notifyParent('BOOK_VENUE', { venueId: venueId });
    }

    function filterSport(sport) {
      currentFilter = sport;
      var chips = document.querySelectorAll('.filter-chip');
      for (var i = 0; i < chips.length; i++) {
        chips[i].classList.remove('active');
      }
      var target = document.getElementById('chip_' + sport);
      if (target) target.classList.add('active');

      if (isGoogleMapLoaded && googleMap) {
        renderGoogleMarkers();
      } else if (leafletMap) {
        renderLeafletMarkers();
      }
      notifyParent('FILTER_CHANGED', { sport: sport });
    }

    function setCity(city) {
      currentCity = city;
      var btnHn = document.getElementById('btnHanoi');
      var btnHcm = document.getElementById('btnHcm');
      if (btnHn) btnHn.classList.toggle('active', city === 'hn');
      if (btnHcm) btnHcm.classList.toggle('active', city === 'hcm');
      var target = CITIES[city];
      if (target) {
        if (isGoogleMapLoaded && googleMap) {
          googleMap.panTo({ lat: target.lat, lng: target.lng });
          googleMap.setZoom(target.zoom);
        } else if (leafletMap) {
          leafletMap.setView([target.lat, target.lng], target.zoom);
        }
      }
    }

    // Geolocation: locate user position
    function locateUser() {
      var badge = document.getElementById('venueCountText');
      badge.textContent = 'Đang định vị tọa độ GPS của bạn...';

      if (!navigator.geolocation) {
        alert('Trình duyệt của bạn không hỗ trợ định vị GPS.');
        badge.textContent = 'Không hỗ trợ định vị';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          var accuracy = pos.coords.accuracy || 20;
          currentUserPos = { lat: lat, lng: lng };

          if (isGoogleMapLoaded && googleMap) {
            googleMap.panTo({ lat: lat, lng: lng });
            googleMap.setZoom(15);

            if (window.userMarker) window.userMarker.setMap(null);
            if (window.userCircle) window.userCircle.setMap(null);

            window.userCircle = new google.maps.Circle({
              strokeColor: '#2563eb',
              strokeOpacity: 0.5,
              strokeWeight: 1.5,
              fillColor: '#3b82f6',
              fillOpacity: 0.15,
              map: googleMap,
              center: { lat: lat, lng: lng },
              radius: Math.min(accuracy, 250)
            });

            window.userMarker = new google.maps.Marker({
              position: { lat: lat, lng: lng },
              map: googleMap,
              title: 'Vị trí hiện tại của bạn',
              zIndex: 9999,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 9,
                fillColor: '#2563eb',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 3.5
              }
            });

            var userIw = new google.maps.InfoWindow({
              content: '<div style="padding: 8px 12px; font-family: inherit; font-size: 12px; font-weight: 700; color: #1e293b;">📍 Vị trí hiện tại của bạn</div>'
            });
            userIw.open(googleMap, window.userMarker);
          } else if (leafletMap) {
            leafletMap.setView([lat, lng], 15);
            if (window.leafletUserMarker) leafletMap.removeLayer(window.leafletUserMarker);
            if (window.leafletUserCircle) leafletMap.removeLayer(window.leafletUserCircle);
            window.leafletUserCircle = L.circle([lat, lng], { radius: Math.min(accuracy, 250), color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.15 }).addTo(leafletMap);
            window.leafletUserMarker = L.circleMarker([lat, lng], { radius: 9, fillColor: '#2563eb', color: '#fff', weight: 3.5, fillOpacity: 1 }).addTo(leafletMap);
          }

          // Calculate closest venue
          var closest = null;
          var minD = 999999;
          for (var i = 0; i < venuesData.length; i++) {
            var v = venuesData[i];
            var dist = getDistanceFromLatLonInKm(lat, lng, v.lat, v.lng);
            if (dist < minD) {
              minD = dist;
              closest = v;
            }
          }

          var dStr = minD < 1.0 ? Math.round(minD * 1000) + 'm' : minD.toFixed(1) + 'km';
          if (closest) {
            badge.textContent = '📍 Gần nhất: ' + closest.name + ' (' + dStr + ')';
          } else {
            badge.textContent = '📍 Đã xác định vị trí của bạn';
          }

          notifyParent('USER_LOCATED', { lat: lat, lng: lng, accuracy: accuracy });
        },
        function(err) {
          badge.textContent = 'Chưa bật GPS hoặc từ chối quyền';
          console.warn('Geolocation error:', err);
          alert('Không thể xác định vị trí của bạn: ' + err.message + '\nVui lòng cho phép quyền truy cập Vị trí trên trình duyệt.');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

    function focusVenueById(venueId) {
      if (isGoogleMapLoaded && googleMap) {
        for (var i = 0; i < googleMarkers.length; i++) {
          var m = googleMarkers[i];
          if (m.venueId === venueId) {
            googleMap.panTo(m.getPosition());
            googleMap.setZoom(16);
            if (currentInfoWindow) currentInfoWindow.close();
            currentInfoWindow = new google.maps.InfoWindow({
              content: buildCardHtml(m.venueData),
              pixelOffset: new google.maps.Size(0, -infoOffsetY(16))
            });
            currentInfoWindow.open(googleMap, m);
            break;
          }
        }
      } else if (leafletMap) {
        for (var i = 0; i < leafletMarkers.length; i++) {
          var lm = leafletMarkers[i];
          if (lm.venueId === venueId) {
            leafletMap.setView(lm.getLatLng(), 16);
            lm.openPopup();
            break;
          }
        }
      }
    }

    function notifyParent(type, data) {
      if (window.parent && window.parent !== window) {
        var msg = Object.assign({ type: type }, data);
        window.parent.postMessage(msg, '*');
      }
    }

    // Xin ứng dụng gửi danh sách sân mới nhất (ứng dụng trả lời bằng SET_VENUES); thử lại vài lần nếu chưa có dữ liệu
    function requestVenues() {
      notifyParent('REQUEST_VENUES', {});
    }
    window.addEventListener('load', function() {
      requestVenues();
      setTimeout(function() { if (venuesData.length === 0) requestVenues(); }, 1200);
      setTimeout(function() { if (venuesData.length === 0) requestVenues(); }, 3500);
    });

    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || !data.type) return;
      if (data.type === 'FOCUS_VENUE') {
        focusVenueById(data.venueId);
      } else if (data.type === 'FILTER_SPORT') {
        filterSport(data.sport);
      } else if (data.type === 'SET_VENUES') {
        venuesData = Array.isArray(data.venues) ? data.venues : venuesData;
        if (isGoogleMapLoaded) renderGoogleMarkers();
        else if (leafletMap) renderLeafletMarkers();
      } else if (data.type === 'LOCATE_USER') {
        locateUser();
      }
    });
  </script>
</body>
</html>
