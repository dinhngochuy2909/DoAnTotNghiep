name: Kiểm tra mã

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    # Chạy trên Windows vì một số bài kiểm thử giao diện nạp phông Segoe UI để đo bề rộng chữ
    runs-on: windows-latest
    defaults:
      run:
        working-directory: alobooking
    steps:
      - uses: actions/checkout@v4

      - name: Đặt múi giờ Việt Nam
        run: tzutil /s "SE Asia Standard Time"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Tải thư viện
        run: flutter pub get

      - name: Phân tích mã
        run: dart analyze --fatal-infos

      - name: Kiểm thử tự động
        run: flutter test

      - name: Kiểm thử tích hợp Gemini (chỉ khi kho có secret GEMINI_API_KEY)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if (-not $env:GEMINI_API_KEY) { Write-Output "Chưa khai báo secret GEMINI_API_KEY: bỏ qua"; exit 0 }
          flutter test test/integration/gemini_live_test.dart --dart-define=GEMINI_API_KEY=$env:GEMINI_API_KEY

      - name: Kiểm thử máy nhận webhook SePay
        working-directory: sepay-webhook
        run: node --test test/worker.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Kiểm thử luật bảo mật và luồng đặt sân trên bộ mô phỏng Firebase
        shell: bash
        run: |
          npm install -g firebase-tools@15.37.0
          firebase emulators:exec --only firestore,auth --project demo-alobooking "node --test firestore-tests/rules.test.mjs && node --test firestore-tests/worker.emulator.test.mjs && flutter test test/integration/emulator_flow_test.dart --dart-define=FIREBASE_EMULATOR=127.0.0.1 --dart-define=FIREBASE_PROJECT=demo-alobooking"
