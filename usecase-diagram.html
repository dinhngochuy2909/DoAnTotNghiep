<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ Use Case - Ứng dụng Quản lý và Đặt sân Thể thao</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans', 'Inter', sans-serif;
      background: #ffffff;
      color: #1a1a2e;
      min-height: 100vh;
    }

    .page-header {
      text-align: center;
      padding: 30px 20px 10px;
      background: #fff;
    }

    .page-header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .page-header .subtitle {
      font-size: 0.85rem;
      color: #666;
      font-style: italic;
    }

    /* ============ DIAGRAM CONTAINER ============ */
    .diagram-wrapper {
      padding: 10px 20px 40px;
      display: flex;
      justify-content: center;
    }

    svg.usecase-diagram {
      max-width: 100%;
      height: auto;
    }

    /* Actor stick figure */
    .actor-group text {
      font-family: 'Noto Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #1a1a2e;
      text-anchor: middle;
    }

    .actor-group line, .actor-group circle {
      stroke: #1a1a2e;
      stroke-width: 2;
      fill: none;
    }

    /* Use case ellipses */
    .usecase ellipse {
      fill: #f0f4ff;
      stroke: #3b5998;
      stroke-width: 1.5;
    }

    .usecase text {
      font-family: 'Noto Sans', sans-serif;
      font-size: 10.5px;
      fill: #1a1a2e;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* System boundary */
    .system-boundary rect {
      fill: none;
      stroke: #1a1a2e;
      stroke-width: 2;
      rx: 8;
      ry: 8;
    }

    .system-boundary text {
      font-family: 'Noto Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #1a1a2e;
    }

    /* Association lines */
    .assoc-line {
      stroke: #555;
      stroke-width: 1.2;
      fill: none;
    }

    /* Include/Extend dashed lines */
    .include-line {
      stroke: #888;
      stroke-width: 1;
      stroke-dasharray: 6,3;
      fill: none;
    }

    .include-label {
      font-family: 'Noto Sans', sans-serif;
      font-size: 9px;
      fill: #888;
      font-style: italic;
    }

    /* Module sub-boundaries */
    .module-boundary rect {
      fill: rgba(240, 244, 255, 0.3);
      stroke: #aab;
      stroke-width: 1;
      stroke-dasharray: 5,3;
      rx: 6;
      ry: 6;
    }

    .module-boundary text {
      font-family: 'Noto Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #3b5998;
    }

    /* Color coding for different modules */
    .mod-court ellipse { fill: #e8f5e9; stroke: #2e7d32; }
    .mod-booking ellipse { fill: #e3f2fd; stroke: #1565c0; }
    .mod-customer ellipse { fill: #fce4ec; stroke: #c62828; }
    .mod-payment ellipse { fill: #fff3e0; stroke: #e65100; }
    .mod-admin ellipse { fill: #f3e5f5; stroke: #6a1b9a; }
    .mod-ai ellipse { fill: #e0f7fa; stroke: #00695c; }

    /* Legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 8px 20px 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #555;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1.5px solid;
    }

    /* Print-friendly */
    @media print {
      body { background: #fff; }
      .page-header { padding-top: 10px; }
    }
  </style>
</head>
<body>
