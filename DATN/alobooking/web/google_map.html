<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bản đồ sân thể thao Alobooking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Be Vietnam Pro', -apple-system, sans-serif; background: #e2e8f0; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    
    /* Top floating bar */
    .map-controls-top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .map-controls-top > * { pointer-events: auto; }
    
    .chip-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 5px 8px;
      border-radius: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      backdrop-filter: blur(8px);
      -webkit-overflow-scrolling: touch;
    }
    .chip-bar::-webkit-scrollbar { display: none; }
    
    .filter-chip {
      border: none;
      outline: none;
      background: #f1f5f9;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: inherit;
    }
    .filter-chip:hover { background: #e2e8f0; }
    .filter-chip.active {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.35);
    }
    
    .city-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 3px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      backdrop-filter: blur(8px);
      margin-left: auto;
    }
    .city-btn {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s;
      font-family: inherit;
    }
    .city-btn.active {
      background: #0f172a;
      color: #ffffff;
    }
    
    /* Prominent GPS button with text */
    .locate-pill-btn {
      position: absolute;
      bottom: 20px;
      right: 12px;
      z-index: 999;
      background: linear-gradient(135deg, #15803d, #16a34a);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 24px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(21, 128, 61, 0.45);
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .locate-pill-btn:hover {
      background: linear-gradient(135deg, #166534, #15803d);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(21, 128, 61, 0.55);
    }
    .locate-pill-btn:active {
      transform: translateY(0);
    }
    .locate-pill-btn svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }
    .locate-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse-ring 1.3s infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 8px #4ade80; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }
    
    .venue-count-badge {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 999;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: calc(100% - 190px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .venue-count-dot {
      width: 8px;
      height: 8px;
      min-width: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    
    /* Card popup styles */
    .gm-style-iw { padding: 0 !important; border-radius: 14px !important; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.16) !important; }
    .gm-style-iw-d { padding: 0 !important; overflow: hidden !important; max-height: none !important; }
    .gm-ui-hover-effect { top: 4px !important; right: 4px !important; background: rgba(255,255,255,0.9) !important; border-radius: 50% !important; }
    
    .leaflet-popup-content-wrapper { padding: 0 !important; border-radius: 14px !important; overflow: hidden; }
    .leaflet-popup-content { margin: 0 !important; line-height: normal !important; }
    
    .iw-card { width: 260px; font-family: 'Be Vietnam Pro', sans-serif; background: #ffffff; }
    .iw-img-wrapper { position: relative; width: 100%; height: 110px; background: #cbd5e1; overflow: hidden; }
    .iw-img { width: 100%; height: 100%; object-fit: cover; }
    .iw-badge { position: absolute; top: 6px; left: 6px; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; }
    .iw-rating { position: absolute; top: 6px; right: 6px; background: rgba(15, 23, 42, 0.85); color: #fbbf24; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
    .iw-content { padding: 10px 12px 12px 12px; }
    .iw-title { font-size: 13px; font-weight: 700; color: #0f172a; line-height: 1.3; margin-bottom: 4px; }
    .iw-addr { font-size: 11px; color: #64748b; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .iw-dist { font-size: 11px; color: #16a34a; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 3px; }
    .iw-hours { font-size: 11px; color: #059669; font-weight: 600; margin-bottom: 8px; }
    .iw-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 8px; gap: 8px; }
    .iw-price { font-size: 12px; font-weight: 800; color: #16a34a; }
    .iw-book-btn { background: #16a34a; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .iw-book-btn:hover { background: #15803d; }
  </style>
</head>

      pickleball: '<g transform="translate(24, 21)"><g transform="translate(-4, -1) rotate(-18)"><rect x="-2.2" y="7" width="4.4" height="9" rx="1.5" fill="#1E293B" stroke="#0F172A" stroke-width="1"/><line x1="-2" y1="9.5" x2="2" y2="8.5" stroke="#94A3B8" stroke-width="0.9"/><line x1="-2" y1="12" x2="2" y2="11" stroke="#94A3B8" stroke-width="0.9"/><line x1="-2" y1="14.5" x2="2" y2="13.5" stroke="#94A3B8" stroke-width="0.9"/><rect x="-9.5" y="-12" width="19" height="17" rx="5" fill="#7C3AED" stroke="#4C1D95" stroke-width="1.6"/><rect x="-7.5" y="-10" width="15" height="13" rx="3.5" fill="#9333EA"/><circle cx="0" cy="-3.5" r="3.5" fill="#C084FC" opacity="0.6"/></g><g transform="translate(8, 3)"><circle cx="0" cy="0" r="7" fill="#FACC15" stroke="#B45309" stroke-width="1.4"/><circle cx="-2.8" cy="-2.8" r="1.2" fill="#78350F"/><circle cx="2.6" cy="-2.8" r="1.2" fill="#78350F"/><circle cx="-3" cy="2.5" r="1.2" fill="#78350F"/><circle cx="2.6" cy="2.5" r="1.2" fill="#78350F"/><circle cx="0" cy="0" r="1.2" fill="#78350F"/><circle cx="-2" cy="-2.5" r="3" fill="#FEF08A" opacity="0.6"/></g></g>',
      football: '<g transform="translate(24, 21)"><circle cx="0" cy="0" r="13.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/><polygon points="0,-4.5 4.3,-1.4 2.7,3.6 -2.7,3.6 -4.3,-1.4" fill="#0F172A"/><polygon points="-3,-13.2 3,-13.2 2.2,-9.5 -2.2,-9.5" fill="#0F172A"/><line x1="0" y1="-4.5" x2="0" y2="-9.5" stroke="#0F172A" stroke-width="1.5"/><polygon points="9.5,-9.5 13,-4 10.5,-2 7.5,-5.5" fill="#0F172A"/><line x1="4.3" y1="-1.4" x2="7.5" y2="-5.5" stroke="#0F172A" stroke-width="1.5"/><polygon points="12.5,4 8,11 6,8.5 8.5,3" fill="#0F172A"/><line x1="2.7" y1="3.6" x2="6" y2="8.5" stroke="#0F172A" stroke-width="1.5"/><polygon points="-12.5,4 -8,11 -6,8.5 -8.5,3" fill="#0F172A"/><line x1="-2.7" y1="3.6" x2="-6" y2="8.5" stroke="#0F172A" stroke-width="1.5"/><polygon points="-9.5,-9.5 -13,-4 -10.5,-2 -7.5,-5.5" fill="#0F172A"/><line x1="-4.3" y1="-1.4" x2="-7.5" y2="-5.5" stroke="#0F172A" stroke-width="1.5"/><line x1="2.2" y1="-9.5" x2="7.5" y2="-5.5" stroke="#0F172A" stroke-width="1.3"/><line x1="10.5" y1="-2" x2="8.5" y2="3" stroke="#0F172A" stroke-width="1.3"/><line x1="6" y1="8.5" x2="-6" y2="8.5" stroke="#0F172A" stroke-width="1.3"/><line x1="-8.5" y1="3" x2="-10.5" y2="-2" stroke="#0F172A" stroke-width="1.3"/><line x1="-7.5" y1="-5.5" x2="-2.2" y2="-9.5" stroke="#0F172A" stroke-width="1.3"/><ellipse cx="-4" cy="-5" rx="5" ry="3.5" transform="rotate(-30 -4 -5)" fill="#FFFFFF" opacity="0.35"/></g>',
      tennis: '<g transform="translate(24, 21)"><circle cx="0" cy="0" r="13.5" fill="#CCFF00" stroke="#3F6212" stroke-width="1.6"/><path d="M-9,-9 C-3,-3 -3,3 -9,9" fill="none" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round"/><path d="M-9,-9 C-3,-3 -3,3 -9,9" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/><path d="M9,-9 C3,-3 3,3 9,9" fill="none" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round"/><path d="M9,-9 C3,-3 3,3 9,9" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/><circle cx="-3.5" cy="-4.5" r="5" fill="#FFFFFF" opacity="0.35"/></g>',
      basketball: '<g transform="translate(24, 21)"><circle cx="0" cy="0" r="13.5" fill="#EA580C" stroke="#7C2D12" stroke-width="1.6"/><line x1="-13.5" y1="0" x2="13.5" y2="0" stroke="#431407" stroke-width="1.8"/><line x1="0" y1="-13.5" x2="0" y2="13.5" stroke="#431407" stroke-width="1.8"/><path d="M-8.5,-10 C-3,-4 -3,4 -8.5,10" fill="none" stroke="#431407" stroke-width="1.6"/><path d="M8.5,-10 C3,-4 3,4 8.5,10" fill="none" stroke="#431407" stroke-width="1.6"/><circle cx="-3.5" cy="-4.5" r="5" fill="#FDBA74" opacity="0.35"/></g>'
    };

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      var R = 6371;
      var dLat = (lat2 - lat1) * (Math.PI / 180);
      var dLon = (lon2 - lon1) * (Math.PI / 180);
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function initGoogleMap() {
      if (isGoogleMapLoaded) return;
      try {
        if (!window.google || !window.google.maps) {
          throw new Error('Google Maps SDK not ready');
        }

        var mapDiv = document.getElementById('map');
        mapDiv.innerHTML = '';

        var initial = CITIES.hn;
        googleMap = new google.maps.Map(mapDiv, {
          center: { lat: initial.lat, lng: initial.lng },
          zoom: initial.zoom,
          mapTypeControl: false,
          zoomControl: true,
          zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
          streetViewControl: false,
          fullscreenControl: false,
          styles: [
            { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
            { featureType: 'transit', elementType: 'labels.icon', stylers: [{ visibility: 'off' }] },
            { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#c7e3f4' }] },
            { featureType: 'landscape.natural', elementType: 'geometry', stylers: [{ color: '#f8fafc' }] }
          ]
        });

        isGoogleMapLoaded = true;
        renderGoogleMarkers();
        console.log('Google Maps initialized successfully with', venuesData.length, 'venues');
      } catch (err) {
        console.warn('Google Maps initialization failed, switching to backup map:', err);
        initLeafletMap();
      }
    }

    function initLeafletMap() {
      if (isGoogleMapLoaded) return;
      if (leafletMap) return;

      var mapDiv = document.getElementById('map');
      mapDiv.innerHTML = '';

      var initial = CITIES.hn;
      leafletMap = L.map('map', { zoomControl: false }).setView([initial.lat, initial.lng], initial.zoom);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap);

      L.control.zoom({ position: 'topright' }).addTo(leafletMap);
      renderLeafletMarkers();
      console.log('Backup map initialized successfully with', venuesData.length, 'venues');
    }

    setTimeout(function() {
      if (!isGoogleMapLoaded) {
        initLeafletMap();
      }
    }, 3000);

    // Creates high-definition SVG pin with the sport logo inside
    function createMarkerIconSvg(type) {
      var color = SPORT_COLORS[type] || '#15803d';
      var logoSvg = SPORT_SVG_LOGOS[type] || SPORT_SVG_LOGOS['badminton'];

      return '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="58" viewBox="0 0 48 58">' +
        '<defs>' +
          '<filter id="sh_' + type + '" x="-25%" y="-20%" width="150%" height="150%">' +
            '<feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-opacity="0.45"/>' +
          '</filter>' +
        '</defs>' +
        '<path d="M24 2C13 2 4 11 4 22c0 14 20 32 20 32s20-18 20-32C44 11 35 2 24 2z" fill="' + color + '" filter="url(#sh_' + type + ')"/>' +
        '<circle cx="24" cy="21" r="16.5" fill="#ffffff"/>' +
        logoSvg +
      '</svg>';
    }

    function buildCardHtml(v) {
      var color = SPORT_COLORS[v.type] || '#15803d';
      var typeName = SPORT_NAMES[v.type] || v.type;
      var img = v.image || 'https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?w=600';

      var distHtml = '';
      if (currentUserPos) {
        var d = getDistanceFromLatLonInKm(currentUserPos.lat, currentUserPos.lng, v.lat, v.lng);
        var dStr = d < 1.0 ? Math.round(d * 1000) + ' m' : d.toFixed(1) + ' km';
        distHtml = '<div class="iw-dist">📍 Cách bạn: ' + dStr + '</div>';
      }

      return '<div class="iw-card">' +
        '<div class="iw-img-wrapper">' +
          '<img class="iw-img" src="' + img + '" alt="' + v.name + '"/>' +
          '<div class="iw-badge" style="background: ' + color + ';">' + typeName + '</div>' +
          '<div class="iw-rating">★ ' + (v.rating || 4.8) + '</div>' +
        '</div>' +
        '<div class="iw-content">' +
          '<div class="iw-title">' + v.name + '</div>' +
          distHtml +
          '<div class="iw-addr">📌 ' + (v.address || v.district || 'Hà Nội') + '</div>' +
          '<div class="iw-hours">⏰ ' + (v.hours || '06:00 - 23:00') + '</div>' +
          '<div class="iw-footer">' +
            '<div class="iw-price">' + (v.price || '100.000đ/h') + '</div>' +
            '<button class="iw-book-btn" onclick="bookVenue(' + v.id + ')">Đặt sân</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function renderGoogleMarkers() {
      for (var i = 0; i < googleMarkers.length; i++) {
        googleMarkers[i].setMap(null);
      }
      googleMarkers = [];

      var visibleCount = 0;
      var svgIconBase = 'data:image/svg+xml;charset=UTF-8,';

      for (var j = 0; j < venuesData.length; j++) {
        var v = venuesData[j];
        if (currentFilter !== 'all' && v.type !== currentFilter) continue;

        var svg = createMarkerIconSvg(v.type);
        var marker = new google.maps.Marker({
          position: { lat: Number(v.lat), lng: Number(v.lng) },
          map: googleMap,
          title: v.name,
          icon: {
            url: svgIconBase + encodeURIComponent(svg),
            scaledSize: new google.maps.Size(48, 58),
            anchor: new google.maps.Point(24, 58)
          }
        });

        marker.venueId = v.id;
        marker.venueData = v;

        (function(m, venue) {
          m.addListener('click', function() {
            if (currentInfoWindow) currentInfoWindow.close();
            currentInfoWindow = new google.maps.InfoWindow({
              content: buildCardHtml(venue),
              pixelOffset: new google.maps.Size(0, -42)
            });
            currentInfoWindow.open(googleMap, m);
            notifyParent('VENUE_SELECTED', { venueId: venue.id });
          });
        })(marker, v);

        googleMarkers.push(marker);
        visibleCount++;
      }

      document.getElementById('venueCountText').textContent = visibleCount + ' sân thể thao khả dụng';
    }

    function renderLeafletMarkers() {
      for (var i = 0; i < leafletMarkers.length; i++) {
        leafletMap.removeLayer(leafletMarkers[i]);
      }
      leafletMarkers = [];

      var visibleCount = 0;
      for (var j = 0; j < venuesData.length; j++) {
        var v = venuesData[j];
        if (currentFilter !== 'all' && v.type !== currentFilter) continue;

        var svg = createMarkerIconSvg(v.type);
        var icon = L.divIcon({
          html: svg,
          className: '',
          iconSize: [48, 58],
          iconAnchor: [24, 58],
          popupAnchor: [0, -48]
        });

        var marker = L.marker([Number(v.lat), Number(v.lng)], { icon: icon }).addTo(leafletMap);
        marker.venueId = v.id;
        marker.venueData = v;
        marker.bindPopup(buildCardHtml(v));

        (function(venue) {
          marker.on('click', function() {
            notifyParent('VENUE_SELECTED', { venueId: venue.id });
          });
        })(v);

        leafletMarkers.push(marker);
        visibleCount++;
      }

      document.getElementById('venueCountText').textContent = visibleCount + ' sân thể thao khả dụng';
    }

    function bookVenue(venueId) {
      notifyParent('BOOK_VENUE', { venueId: venueId });
    }

    function filterSport(sport) {
      currentFilter = sport;
      var chips = document.querySelectorAll('.filter-chip');
      for (var i = 0; i < chips.length; i++) {
        chips[i].classList.remove('active');
      }
      var target = document.getElementById('chip_' + sport);
      if (target) target.classList.add('active');

      if (isGoogleMapLoaded && googleMap) {
        renderGoogleMarkers();
      } else if (leafletMap) {
        renderLeafletMarkers();
      }
      notifyParent('FILTER_CHANGED', { sport: sport });
    }

    function setCity(city) {
      currentCity = city;
      var btnHn = document.getElementById('btnHanoi');
      var btnHcm = document.getElementById('btnHcm');
      if (btnHn) btnHn.classList.toggle('active', city === 'hn');
      if (btnHcm) btnHcm.classList.toggle('active', city === 'hcm');
      var target = CITIES[city];
      if (target) {
        if (isGoogleMapLoaded && googleMap) {
          googleMap.panTo({ lat: target.lat, lng: target.lng });
          googleMap.setZoom(target.zoom);
        } else if (leafletMap) {
          leafletMap.setView([target.lat, target.lng], target.zoom);
        }
      }
    }

    // Geolocation: locate user position
    function locateUser() {
      var badge = document.getElementById('venueCountText');
      badge.textContent = 'Đang định vị tọa độ GPS của bạn...';

      if (!navigator.geolocation) {
        alert('Trình duyệt của bạn không hỗ trợ định vị GPS.');
        badge.textContent = 'Không hỗ trợ định vị';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          var accuracy = pos.coords.accuracy || 20;
          currentUserPos = { lat: lat, lng: lng };

          if (isGoogleMapLoaded && googleMap) {
            googleMap.panTo({ lat: lat, lng: lng });
            googleMap.setZoom(15);

            if (window.userMarker) window.userMarker.setMap(null);
            if (window.userCircle) window.userCircle.setMap(null);

            window.userCircle = new google.maps.Circle({
              strokeColor: '#2563eb',
              strokeOpacity: 0.5,
              strokeWeight: 1.5,
              fillColor: '#3b82f6',
              fillOpacity: 0.15,
              map: googleMap,
              center: { lat: lat, lng: lng },
              radius: Math.min(accuracy, 250)
            });

            window.userMarker = new google.maps.Marker({
              position: { lat: lat, lng: lng },
              map: googleMap,
              title: 'Vị trí hiện tại của bạn',
              zIndex: 9999,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 9,
                fillColor: '#2563eb',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 3.5
              }
            });

            var userIw = new google.maps.InfoWindow({
              content: '<div style="padding: 8px 12px; font-family: inherit; font-size: 12px; font-weight: 700; color: #1e293b;">📍 Vị trí hiện tại của bạn</div>'
            });
            userIw.open(googleMap, window.userMarker);
          } else if (leafletMap) {
            leafletMap.setView([lat, lng], 15);
            if (window.leafletUserMarker) leafletMap.removeLayer(window.leafletUserMarker);
            if (window.leafletUserCircle) leafletMap.removeLayer(window.leafletUserCircle);
            window.leafletUserCircle = L.circle([lat, lng], { radius: Math.min(accuracy, 250), color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.15 }).addTo(leafletMap);
            window.leafletUserMarker = L.circleMarker([lat, lng], { radius: 9, fillColor: '#2563eb', color: '#fff', weight: 3.5, fillOpacity: 1 }).addTo(leafletMap);
          }

          // Calculate closest venue
          var closest = null;
          var minD = 999999;
          for (var i = 0; i < venuesData.length; i++) {
            var v = venuesData[i];
            var dist = getDistanceFromLatLonInKm(lat, lng, v.lat, v.lng);
            if (dist < minD) {
              minD = dist;
              closest = v;
            }
          }

          var dStr = minD < 1.0 ? Math.round(minD * 1000) + 'm' : minD.toFixed(1) + 'km';
          if (closest) {
            badge.textContent = '📍 Gần nhất: ' + closest.name + ' (' + dStr + ')';
          } else {
            badge.textContent = '📍 Đã xác định vị trí của bạn';
          }

          notifyParent('USER_LOCATED', { lat: lat, lng: lng, accuracy: accuracy });
        },
        function(err) {
          badge.textContent = 'Chưa bật GPS hoặc từ chối quyền';
          console.warn('Geolocation error:', err);
          alert('Không thể xác định vị trí của bạn: ' + err.message + '\nVui lòng cho phép quyền truy cập Vị trí trên trình duyệt.');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    }

    function focusVenueById(venueId) {
      if (isGoogleMapLoaded && googleMap) {
        for (var i = 0; i < googleMarkers.length; i++) {
          var m = googleMarkers[i];
          if (m.venueId === venueId) {
            googleMap.panTo(m.getPosition());
            googleMap.setZoom(16);
            if (currentInfoWindow) currentInfoWindow.close();
            currentInfoWindow = new google.maps.InfoWindow({
              content: buildCardHtml(m.venueData),
              pixelOffset: new google.maps.Size(0, -42)
            });
            currentInfoWindow.open(googleMap, m);
            break;
          }
        }
      } else if (leafletMap) {
        for (var i = 0; i < leafletMarkers.length; i++) {
          var lm = leafletMarkers[i];
          if (lm.venueId === venueId) {
            leafletMap.setView(lm.getLatLng(), 16);
            lm.openPopup();
            break;
          }
        }
      }
    }

    function notifyParent(type, data) {
      if (window.parent && window.parent !== window) {
        var msg = Object.assign({ type: type }, data);
        window.parent.postMessage(msg, '*');
      }
    }

    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || !data.type) return;
      if (data.type === 'FOCUS_VENUE') {
        focusVenueById(data.venueId);
      } else if (data.type === 'FILTER_SPORT') {
        filterSport(data.sport);
      } else if (data.type === 'SET_VENUES') {
        venuesData = data.venues || venuesData;
        if (isGoogleMapLoaded) renderGoogleMarkers();
        else if (leafletMap) renderLeafletMarkers();
      } else if (data.type === 'LOCATE_USER') {
        locateUser();
      }
    });
  </script>
